name: CI - Build and Push

# Когда запускать: при пуше в ветку main
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Права, нужные джобе, чтобы публиковать образ в GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # Скачиваем код репозитория на виртуальную машину GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Логинимся в GitHub Container Registry.
      # GITHUB_TOKEN — секрет, который GitHub создаёт автоматически для каждого запуска,
      # вводить/создавать самому ничего не нужно.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Настраиваем сборщик Docker (buildx — расширенный движок сборки)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Собираем образ и пушим его в GHCR с двумя тегами:
      # latest (всегда последняя версия) и sha (уникальный тег под конкретный коммит — 
      # это и есть версионированный артефакт, к которому всегда можно откатиться)
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/calculator:latest
            ghcr.io/${{ github.repository_owner }}/calculator:${{ github.sha }}