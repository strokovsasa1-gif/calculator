name: CI

# Запуск: при пуше в main
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # cache: pip сохраняет скачанные библиотеки между запусками,
      # поэтому при следующей сборке они не качаются заново
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Быстрая проверка, что приложение вообще импортируется без ошибок
      - name: Smoke check
        run: python -c "from app.main import app; print('import ok')"

      # Упаковываем всё нужное для образа в один архив — это и есть артефакт сборки
      - name: Package build artifact
        run: tar -czf calculator-build.tar.gz app requirements.txt Dockerfile

      # Сохраняем архив в GitHub, чтобы его можно было найти и скачать
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: calculator-build.tar.gz
          retention-days: 90