<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 80px; }
  .calc { background: #1e1e2f; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  input, select, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; font-size: 16px; }
  button { background: #6c5ce7; color: white; cursor: pointer; }
  #result { color: #00e676; font-size: 24px; margin-top: 15px; text-align: center; }
  h2 { color: white; text-align: center; }
</style>
</head>
<body>
<div class="calc">
  <h2>Calculator</h2>
  <input id="a" type="number" placeholder="Число A">
  <select id="op">
    <option value="add">+</option>
    <option value="sub">-</option>
    <option value="mul">×</option>
    <option value="div">÷</option>
  </select>
  <input id="b" type="number" placeholder="Число B">
  <br>
  <button onclick="calc()">Вычислить</button>
  <div id="result"></div>
</div>
<script>
async function calc() {
  const a = document.getElementById('a').value;
  const b = document.getElementById('b').value;
  const op = document.getElementById('op').value;
  const res = await fetch(`/api/calc?a=${a}&b=${b}&op=${op}`);
  const data = await res.json();
  document.getElementById('result').innerText = data.result !== undefined ? `= ${data.result}` : 'Ошибка';
}
</script>
</body>
</html>
